<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MagicTrick — your instruction</title>
  <link rel="stylesheet" href="prompt.css" />
</head>
<body>
  <form id="prompt-form">
    <input
      id="instruction"
      type="text"
      placeholder="e.g. make it more formal, translate to German, shorten to 3 sentences…"
      autocomplete="off"
      autofocus
    />
    <button type="submit">OK</button>
  </form>
  <script src="prompt.js"></script>
</body>
</html>
