<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MagicTrick — your instruction</title>
  <link rel="stylesheet" href="prompt.css" />
</head>
<body>
  <form id="prompt-form">
    <textarea
      id="instruction"
      rows="5"
      spellcheck="false"
      placeholder="Your instruction for MagicTrick…"
      autofocus
    ></textarea>
    <div class="actions">
      <button type="button" id="apply-once">Apply this time</button>
      <button type="button" id="apply-always">Apply for all future emails</button>
      <button type="button" id="restore" class="link" hidden>Restore built-in</button>
    </div>
  </form>
  <script src="prompt.js"></script>
</body>
</html>
