<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MagicTrick: magic wand with sparkles -->
  <!-- wand rod -->
  <line x1="14" y1="50" x2="43" y2="21" stroke="#5b3a1e" stroke-width="9" stroke-linecap="round"/>
  <!-- rod highlight -->
  <line x1="14" y1="50" x2="43" y2="21" stroke="#7a5228" stroke-width="3" stroke-linecap="round"/>
  <!-- main sparkle at the wand tip -->
  <path d="M47 3
           C48.3 10.8 53.2 15.7 61 17
           C53.2 18.3 48.3 23.2 47 31
           C45.7 23.2 40.8 18.3 33 17
           C40.8 15.7 45.7 10.8 47 3 Z"
        fill="#ffd24d" stroke="#e9a213" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- upper-left sparkle -->
  <path d="M18 6
           C18.6 9.9 21.1 12.4 25 13
           C21.1 13.6 18.6 16.1 18 20
           C17.4 16.1 14.9 13.6 11 13
           C14.9 12.4 17.4 9.9 18 6 Z"
        fill="#ffd24d" stroke="#e9a213" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- right sparkle -->
  <path d="M53 37
           C53.5 40 55.5 42 58.5 42.5
           C55.5 43 53.5 45 53 48
           C52.5 45 50.5 43 47.5 42.5
           C50.5 42 52.5 40 53 37 Z"
        fill="#ffd24d" stroke="#e9a213" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- sparkle dust -->
  <circle cx="30" cy="34" r="1.8" fill="#f4c430"/>
  <circle cx="36" cy="7" r="1.5" fill="#f4c430"/>
  <circle cx="24" cy="46" r="1.5" fill="#f4c430"/>
</svg>
